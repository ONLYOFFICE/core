name: ONLYOFFICE WPS Windows x64
on:
  push:
    branches: [codex/windows-wps-installer-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check native Windows compiler
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" && where cl && where nmake && where python"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
